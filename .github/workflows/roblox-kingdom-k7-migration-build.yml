name: Build AstraLife Kingdom K7 Migration

on:
  push:
    branches:
      - feat/roblox-kingdom-k7-migration
    paths:
      - "roblox/src/ReplicatedStorage/Astra/Kingdom/Core/**"
      - "roblox/src/ReplicatedStorage/Astra/Kingdom/K7Migration/**"
      - "roblox/src/ServerScriptService/AstraKingdom/KingdomCoreService.server.lua"
      - "roblox/src/ServerScriptService/AstraKingdom/K7MigrationService.server.lua"
      - "roblox/KINGDOM_K0_CORE.md"
      - "roblox/KINGDOM_K7_MIGRATION.md"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-kingdom-k7-migration-build.yml"
  pull_request:
    branches:
      - feat/roblox-kingdom-k0-core
    paths:
      - "roblox/src/ReplicatedStorage/Astra/Kingdom/K7Migration/**"
      - "roblox/src/ServerScriptService/AstraKingdom/K7MigrationService.server.lua"
      - "roblox/KINGDOM_K7_MIGRATION.md"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-kingdom-k7-migration-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"
      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-Kingdom-K7-Migration.rbxl
      - name: Upload playable place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Kingdom-K7-Migration-Place
          path: AstraLife-Kingdom-K7-Migration.rbxl
          if-no-files-found: error
          retention-days: 14
