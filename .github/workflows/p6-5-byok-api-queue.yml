name: P6.5 Legacy Independent Session Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/p6-5-byok-api-queue-acceptance.mjs'
  workflow_dispatch:

jobs:
  legacy-independent-session-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run legacy independent Agent session regression
        run: node tests/p6-5-byok-api-queue-acceptance.mjs
