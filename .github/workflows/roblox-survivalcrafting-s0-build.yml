name: Build AstraLife SurvivalCrafting S0

on:
  push:
    branches:
      - feat/roblox-survivalcrafting-s0-core
    paths:
      - "roblox/src/ReplicatedStorage/Astra/SurvivalCrafting/**"
      - "roblox/src/ServerScriptService/AstraSurvivalCrafting/**"
      - "roblox/SURVIVALCRAFTING_S0_CORE.md"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-survivalcrafting-s0-build.yml"
  pull_request:
    branches:
      - feat/roblox-w7-ecosystem
    paths:
      - "roblox/src/ReplicatedStorage/Astra/SurvivalCrafting/**"
      - "roblox/src/ServerScriptService/AstraSurvivalCrafting/**"
      - "roblox/SURVIVALCRAFTING_S0_CORE.md"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-survivalcrafting-s0-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"
      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-SurvivalCrafting-S0.rbxl
      - name: Upload playable place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-SurvivalCrafting-S0-Place
          path: AstraLife-SurvivalCrafting-S0.rbxl
          if-no-files-found: error
          retention-days: 14
