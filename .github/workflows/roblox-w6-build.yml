name: Build AstraLife Roblox W6

on:
  push:
    branches:
      - feat/roblox-w6-survival-bridge
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w6-build.yml"
  pull_request:
    branches:
      - feat/roblox-w5-affordance-navigation
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w6-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-W6.rbxl

      - name: Upload W6 place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Roblox-W6
          path: AstraLife-W6.rbxl
          if-no-files-found: error
          retention-days: 14
