name: Build AstraLife Roblox B1

on:
  push:
    branches:
      - feat/roblox-b1-material-grades
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-b1-build.yml"
  pull_request:
    branches:
      - feat/roblox-b0-modular-building
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-b1-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-B1.rbxl

      - name: Upload B1 place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Roblox-B1
          path: AstraLife-B1.rbxl
          if-no-files-found: error
          retention-days: 14
