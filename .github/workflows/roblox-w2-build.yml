name: Build AstraLife Roblox W2

on:
  push:
    branches:
      - feat/roblox-w2-climate-hydrology
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w2-build.yml"
  pull_request:
    branches:
      - feat/roblox-p7-living-world-latest
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w2-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-W2.rbxl

      - name: Upload W2 place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Roblox-W2
          path: AstraLife-W2.rbxl
          if-no-files-found: error
          retention-days: 14
