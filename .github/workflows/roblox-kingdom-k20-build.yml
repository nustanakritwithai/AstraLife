name: Build AstraLife Kingdom K20 Chronicle

on:
  push:
    branches: [feat/roblox-kingdom-k20-chronicle]
  pull_request:
    branches: [feat/roblox-kingdom-k0-core]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"
      - run: rojo build roblox/default.project.json -o AstraLife-Kingdom-K20.rbxl
      - uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Kingdom-K20-Place
          path: AstraLife-Kingdom-K20.rbxl
          if-no-files-found: error
          retention-days: 14
