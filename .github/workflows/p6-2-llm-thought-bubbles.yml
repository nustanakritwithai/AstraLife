name: P6.2 LLM Thought Bubbles

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'js/31-llm-thought-bubbles-p62.js'
      - 'tests/p6-2-llm-thought-bubbles-acceptance.mjs'
      - '.github/workflows/p6-2-llm-thought-bubbles.yml'
  workflow_dispatch:

jobs:
  thought-bubble-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check thought bubble module
        run: node --check js/31-llm-thought-bubbles-p62.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.2 thought bubble acceptance
        run: node tests/p6-2-llm-thought-bubbles-acceptance.mjs
      - name: Re-run P6.1 turn-ahead acceptance
        run: node tests/p6-1-turn-ahead-pipeline-acceptance.mjs
      - name: Re-run P6.1 8-second pacing acceptance
        run: node tests/p6-1-eight-second-pacing-animation-acceptance.mjs
      - name: Re-run P6 BYOK acceptance
        run: node tests/p6-typhoon-byok-acceptance.mjs
      - name: Re-run P4.2 hardening acceptance
        run: node tests/p4-2-executable-plans-hardening-acceptance.mjs
