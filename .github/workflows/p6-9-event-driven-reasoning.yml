name: P6.9 Event Driven Reasoning

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'js/33-byok-api-queue-p65.js'
      - 'js/34-smart-llm-gate-p66.js'
      - 'tests/p6-9-event-driven-reasoning-acceptance.mjs'
      - 'tests/p6-8-full-throughput-rolling-dispatch-acceptance.mjs'
      - '.github/workflows/p6-9-event-driven-reasoning.yml'
  workflow_dispatch:

jobs:
  event-driven-reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check provider stack
        run: |
          node --check js/33-byok-api-queue-p65.js
          node --check js/34-smart-llm-gate-p66.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.9 event-driven API frequency acceptance
        run: node tests/p6-9-event-driven-reasoning-acceptance.mjs
      - name: Re-run P6.8 full-throughput acceptance
        run: node tests/p6-8-full-throughput-rolling-dispatch-acceptance.mjs
      - name: Re-run P6.1 turn-ahead
        run: node tests/p61-turn-ahead-pipeline-acceptance.mjs
      - name: Re-run P6.2 thought bubbles
        run: node tests/p6-2-llm-thought-bubbles-acceptance.mjs
      - name: Re-run P6.3 communication bubbles
        run: node tests/p6-3-agent-communication-bubbles-acceptance.mjs
