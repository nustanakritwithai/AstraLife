name: P6.7 Staggered LLM Admission

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'js/31-llm-thought-bubbles-p62.js'
      - 'js/34-smart-llm-gate-p66.js'
      - 'tests/p6-5-byok-api-queue-acceptance.mjs'
      - 'tests/p6-6-three-workers-smart-gating-acceptance.mjs'
      - 'tests/p6-7-staggered-admission-acceptance.mjs'
      - '.github/workflows/p6-7-staggered-admission.yml'
  workflow_dispatch:

jobs:
  staggered-admission-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check gate and thought overlay
        run: |
          node --check js/34-smart-llm-gate-p66.js
          node --check js/31-llm-thought-bubbles-p62.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.7 staggered admission acceptance
        run: node tests/p6-7-staggered-admission-acceptance.mjs
      - name: Re-run P6.6 three-worker smart gating
        run: node tests/p6-6-three-workers-smart-gating-acceptance.mjs
      - name: Re-run P6.5 independent sessions and queue
        run: node tests/p6-5-byok-api-queue-acceptance.mjs
      - name: Re-run P6.1 turn-ahead
        run: node tests/p6-1-turn-ahead-pipeline-acceptance.mjs
      - name: Re-run P6.2 thought bubbles
        run: node tests/p6-2-llm-thought-bubbles-acceptance.mjs
      - name: Re-run P6.3 communication bubbles
        run: node tests/p6-3-agent-communication-bubbles-acceptance.mjs
