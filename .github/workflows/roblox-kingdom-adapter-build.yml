name: Build AstraLife Kingdom Adapter

on:
  push:
    branches:
      - feat/roblox-kingdom-society-adapter
    paths:
      - "roblox/src/ReplicatedStorage/Astra/Kingdom/**"
      - "roblox/src/ServerScriptService/AstraKingdom/**"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-kingdom-adapter-build.yml"
  pull_request:
    branches:
      - feat/roblox-p4-survival-needs
    paths:
      - "roblox/src/ReplicatedStorage/Astra/Kingdom/**"
      - "roblox/src/ServerScriptService/AstraKingdom/**"
      - "roblox/default.project.json"
      - "rokit.toml"
      - ".github/workflows/roblox-kingdom-adapter-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"
      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-Kingdom-Adapter.rbxl
      - name: Upload playable place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Kingdom-Adapter
          path: AstraLife-Kingdom-Adapter.rbxl
          if-no-files-found: error
          retention-days: 14
