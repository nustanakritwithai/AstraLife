name: P6.1 Turn Ahead 8s

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/**'
      - '.github/workflows/p61-turn-ahead-8s.yml'
  workflow_dispatch:

jobs:
  turn-ahead-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check P6.1 modules
        run: |
          node --check js/29-turn-ahead-pipeline-p61.js
          node --check js/30-eight-second-pacing-animation.js
          node --check tests/p61-turn-ahead-pipeline-acceptance.mjs
          node --check tests/p18-two-second-tick-animation-acceptance.mjs
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run turn-ahead pipeline acceptance
        run: node tests/p61-turn-ahead-pipeline-acceptance.mjs
      - name: Run 8-second pacing and animation acceptance
        run: node tests/p18-two-second-tick-animation-acceptance.mjs
      - name: Re-run P4.2 hardening acceptance
        run: node tests/p4-2-executable-plans-hardening-acceptance.mjs
      - name: Re-run P5.2 cooperative slice acceptance
        run: node tests/p5-2-cooperative-slice-acceptance.mjs
      - name: Re-run P6 provider isolation acceptance
        run: node tests/p6-provider-bridge-isolation-acceptance.mjs
      - name: Re-run P6 BYOK acceptance
        run: node tests/p6-typhoon-byok-acceptance.mjs
