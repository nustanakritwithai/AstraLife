name: Build AstraLife Roblox W4

on:
  push:
    branches:
      - feat/roblox-w4-dynamic-hazards
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w4-build.yml"
  pull_request:
    branches:
      - feat/roblox-w3-living-resources
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-w4-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife-W4.rbxl

      - name: Upload W4 place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Roblox-W4
          path: AstraLife-W4.rbxl
          if-no-files-found: error
          retention-days: 14
