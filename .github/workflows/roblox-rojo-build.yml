name: Build AstraLife Roblox

on:
  push:
    branches:
      - main
      - feat/roblox-rojo
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-rojo-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "roblox/**"
      - "rokit.toml"
      - ".github/workflows/roblox-rojo-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: "v1.1.0"

      - name: Build Roblox place
        run: rojo build roblox/default.project.json -o AstraLife.rbxl

      - name: Upload playable place
        uses: actions/upload-artifact@v4
        with:
          name: AstraLife-Roblox-Place
          path: AstraLife.rbxl
          if-no-files-found: error
          retention-days: 14
