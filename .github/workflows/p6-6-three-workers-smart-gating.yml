name: P6.6 Three Workers + Smart LLM Gating

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'js/33-byok-api-queue-p65.js'
      - 'js/34-smart-llm-gate-p66.js'
      - 'tests/p6-5-byok-api-queue-acceptance.mjs'
      - 'tests/p6-6-three-workers-smart-gating-acceptance.mjs'
      - '.github/workflows/p6-6-three-workers-smart-gating.yml'
  workflow_dispatch:

jobs:
  three-workers-smart-gating:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check queue and gate
        run: |
          node --check js/33-byok-api-queue-p65.js
          node --check js/34-smart-llm-gate-p66.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.6 three-worker smart gating acceptance
        run: node tests/p6-6-three-workers-smart-gating-acceptance.mjs
      - name: Re-run P6.5 independent Agent sessions acceptance
        run: node tests/p6-5-byok-api-queue-acceptance.mjs
      - name: Re-run P6.1 turn-ahead acceptance
        run: node tests/p6-1-turn-ahead-pipeline-acceptance.mjs
      - name: Re-run P6.2 thought bubble acceptance
        run: node tests/p6-2-llm-thought-bubbles-acceptance.mjs
      - name: Re-run P6.3 communication bubble acceptance
        run: node tests/p6-3-agent-communication-bubbles-acceptance.mjs
