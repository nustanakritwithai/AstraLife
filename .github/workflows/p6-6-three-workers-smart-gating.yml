name: P6.6 Legacy Three-Worker Regression

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tests/p6-6-three-workers-smart-gating-acceptance.mjs'
  workflow_dispatch:

jobs:
  legacy-three-worker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run legacy P6.6 regression
        run: node tests/p6-6-three-workers-smart-gating-acceptance.mjs
