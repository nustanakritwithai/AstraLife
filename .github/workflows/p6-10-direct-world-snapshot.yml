name: P6.11 Snapshot Governor

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'js/35-world-snapshot-http-p610.js'
      - 'tests/p6-10-direct-world-snapshot-acceptance.mjs'
      - '.github/workflows/p6-10-direct-world-snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot-governor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check P6.11 provider
        run: node --check js/35-world-snapshot-http-p610.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.11 snapshot governor acceptance
        run: node tests/p6-10-direct-world-snapshot-acceptance.mjs
