name: P6.10 Direct World Snapshot BYOK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'js/35-world-snapshot-http-p610.js'
      - 'tests/p6-10-direct-world-snapshot-acceptance.mjs'
      - '.github/workflows/p6-10-direct-world-snapshot.yml'
  workflow_dispatch:

jobs:
  direct-world-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check P6.10 provider
        run: node --check js/35-world-snapshot-http-p610.js
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run P6.10 direct snapshot acceptance
        run: node tests/p6-10-direct-world-snapshot-acceptance.mjs
      - name: Re-run P6.1 turn-ahead
        run: node tests/p61-turn-ahead-pipeline-acceptance.mjs
      - name: Re-run P6.2 thought bubbles
        run: node tests/p6-2-llm-thought-bubbles-acceptance.mjs
      - name: Re-run P6.3 communication bubbles
        run: node tests/p6-3-agent-communication-bubbles-acceptance.mjs
